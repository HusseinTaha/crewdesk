name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.13", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: CLI smoke test
        if: runner.os != 'Windows'
        run: bash scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.os }}-node${{ matrix.node }}
          path: test-results/
          if-no-files-found: ignore

  package:
    name: npm pack + global install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm pack
      - name: Install tarball globally and run it
        run: |
          npm install -g ./crewdesk-*.tgz
          export CREWDESK_HOME="$RUNNER_TEMP/crewdesk" CREWDESK_PORT=7790
          crewdesk --version
          crewdesk start
          curl -sf "http://127.0.0.1:7790/health"
          curl -sf "http://127.0.0.1:7790/" | grep -q "<div id=\"root\""
          echo '{"session_id":"pack","cwd":"/tmp","hook_event_name":"SessionStart","source":"startup"}' | crewdesk-hook register
          crewdesk stop
