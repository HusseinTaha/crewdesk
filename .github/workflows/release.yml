name: Release

# Push a tag like v0.1.0 (matching package.json "version") to publish to npm.
# Publishing needs the repository secret NPM_TOKEN (npm token with bypass-2FA). Without it, or when the
# version was already published locally, the workflow only runs the tests and creates the GitHub release.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }
      - name: Decide whether to publish to npm
        id: npm
        env:
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::NPM_TOKEN secret is not set: skipping npm publish (publish locally with npm publish)."
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A version published locally takes a few minutes to show up on npm, so look for up to 3 minutes.
          for i in 1 2 3 4 5 6 7; do
            if npm view "crewdesk@$v" version --prefer-online >/dev/null 2>&1; then
              echo "crewdesk@$v is already on npm"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            [ "$i" = 7 ] || sleep 30
          done
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      # prepublishOnly runs build + typecheck + unit tests before publishing.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build && pnpm test:e2e
      - run: npm publish --access public --provenance
        if: steps.npm.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
